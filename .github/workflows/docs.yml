name: API docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow one concurrent deployment, and let it publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dokka 2.0.0's embedded Kotlin analysis cannot run on JDK 25 (it fails with
      # "IllegalArgumentException: 25.0.4.1"), and the worker inherits the Gradle daemon's JVM.
      # dokkaGenerate does not compile anything, so JDK 21 is all this job needs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate KDoc site
        run: ./gradlew dokkaGenerate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
